# Optional: a local Neo4j for teammates who have Docker and don't want to share the Aura instance.
# Then in .env:  NEO4J_URI=neo4j://localhost:7687  NEO4J_USERNAME=neo4j  NEO4J_PASSWORD=groundwork
# and run:       npm run load -- --reset
services:
  neo4j:
    image: neo4j:2026.09
    container_name: groundwork-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/groundwork
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
volumes:
  neo4j-data:
